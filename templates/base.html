<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}LeadLoop{% endblock %} · LeadLoop</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('leads') }}">LeadLoop</a>
    {% if session.user %}
    <form class="search" action="{{ url_for('search') }}" method="get">
      <input type="text" name="q" placeholder="Search leads by name or company" value="{{ request.args.get('q', '') }}">
    </form>
    <nav>
      <span class="who">{{ session.user.full_name }}</span>
      <a href="{{ url_for('logout') }}">Log out</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
